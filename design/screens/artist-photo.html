<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Artist photo · Beach Sync</title>
<!-- Exported from the Beach Sync UI Mock-ups canvas. Static: tokens are in ../tokens.json, behaviour in ../ui-spec.md -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#000000}
a{color:#C8FF4D}a:hover{color:#E2FF9E}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #ECEFF2; font-family: 'Space Grotesk', system-ui, sans-serif; position: relative; overflow: hidden">
  <img src="artist-photo-placeholder.svg" alt="[Artist A], two DJs at the decks on a snowy mountain ridge" style="position: absolute; inset: 0; width: 390px; height: 844px; object-fit: cover; object-position: 50% 50%; display: block">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(0,0,0,0))"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(0deg, rgba(0,0,0,0.85), rgba(0,0,0,0))"></div>
  <a href="now-playing.html" aria-label="Close photo" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; background: rgba(10,12,15,0.55); border: 1px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; color: #ECEFF2">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  <div style="position: absolute; left: 18px; right: 18px; bottom: 26px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 11px; letter-spacing: 0.16em; color: #C4CBD2">NOW PLAYING</span>
    <span style="font-size: 30px; font-weight: 700; line-height: 1.1">[Artist A]</span>
    <span style="font-size: 14px; color: #C4CBD2">[Track title] · [Set name]</span>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px">
      <span style="font-size: 11px; color: #8B95A1">Photo: [credit]</span>
      <span style="display: flex; gap: 6px" aria-label="Photo 1 of 2"><span style="width: 18px; height: 4px; border-radius: 2px; background: #ECEFF2"></span><span style="width: 8px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.35)"></span></span>
    </div>
  </div>
</div>
</body>
</html>
